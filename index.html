<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pygame エディタ</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { height: 100dvh; display: flex; flex-direction: column; background: #282c34; color: #abb2bf; font-family: -apple-system, sans-serif; -webkit-text-size-adjust: 100%; }
header { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-bottom: 1px solid #3e4452; }
header .title { flex: 1; text-align: center; min-width: 0; }
#name { font-weight: 600; color: #d7dae0; }
#status { font-size: 12px; color: #7f848e; }
header button { width: 44px; height: 44px; border: 0; background: none; color: #61afef; display: flex; align-items: center; justify-content: center; border-radius: 8px; padding: 0; }
header button:active { background: #3e4452; }
header button:disabled { opacity: .35; }
svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#run svg { fill: currentColor; stroke: none; width: 26px; height: 26px; }
#run { color: #98c379; }
#run.running { color: #e06c75; }
#run .stop, #run.running .play { display: none; }
#run.running .stop { display: block; }
main { flex: 1; display: flex; min-height: 0; }
#editor { flex: 1; display: flex; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
#code, #hl, #nums, #measure { font-family: Menlo, ui-monospace, monospace; font-size: 16px; line-height: 24px; tab-size: 4; font-variant-ligatures: none; letter-spacing: 0; }
#gutter { width: 48px; overflow: hidden; flex: none; }
#nums { margin: 0; padding: 8px 10px 8px 0; text-align: right; color: #495162; }
#area { flex: 1; position: relative; overflow: hidden; min-width: 0; }
#hl { position: absolute; top: 0; left: 0; margin: 0; padding: 8px; white-space: pre; pointer-events: none; min-width: 100%; }
#code { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 8px; border: 0; outline: 0; resize: none; background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: #528bff; white-space: pre; overflow-wrap: normal; overflow: auto; }
#code::selection { background: rgba(103,118,150,.4); }
#measure { position: absolute; visibility: hidden; white-space: pre; top: 0; left: 0; }
.k { color: #c678dd; } .s { color: #98c379; } .c { color: #7f848e; } .n { color: #d19a66; }
.f { color: #61afef; } .b { color: #56b6c2; } .t { color: #e5c07b; } .v { color: #e06c75; } .o { color: #56b6c2; }
#popup { position: absolute; z-index: 10; width: 300px; max-width: calc(100% - 8px); max-height: 192px; overflow-y: auto; background: #282c34; border: 1px solid #4b5263; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
#popup div { display: flex; justify-content: space-between; gap: 12px; padding: 0 10px; height: 38px; align-items: center; font: 15px Menlo, ui-monospace, monospace; cursor: pointer; }
#popup div.on { background: #3e4452; color: #fff; }
#popup small { color: #7f848e; font-family: -apple-system, sans-serif; white-space: nowrap; }
#panel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; border-left: 1px solid #3e4452; }
#panel[hidden], #popup[hidden] { display: none; }
#screen { flex: 2; overflow: hidden; display: flex; justify-content: center; align-items: center; padding: 8px; min-height: 0; }
#canvas { max-width: 100%; max-height: 100%; object-fit: contain; background: #000; touch-action: none; outline: 0; }
#out { flex: 1; overflow: auto; margin: 0; padding: 10px; border-top: 1px solid #3e4452; white-space: pre-wrap; font: 14px/1.5 Menlo, ui-monospace, monospace; }
@media (orientation: portrait) { main { flex-direction: column; } #panel { border-left: 0; border-top: 1px solid #3e4452; } }
</style>
</head>
<body>
<header>
  <button id="open" aria-label="開く"><svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></svg></button>
  <button id="save" aria-label="ファイルに保存"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 12v8h14v-8"/></svg></button>
  <div class="title"><div id="name">main.py</div><div id="status">準備中…</div></div>
  <button id="toggle" aria-label="実行画面の表示を切りかえる"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M13 4v16"/></svg></button>
  <button id="run" aria-label="実行" disabled><svg class="play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><svg class="stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
  <input id="file" type="file" accept=".py,text/plain" hidden>
</header>
<main>
  <div id="editor">
    <div id="gutter"><pre id="nums"></pre></div>
    <div id="area">
      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="code" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    </div>
    <div id="popup" hidden></div>
    <span id="measure"></span>
  </div>
  <section id="panel" hidden>
    <div id="screen"><canvas id="canvas" tabindex="0" width="400" height="300"></canvas></div>
    <pre id="out"></pre>
  </section>
</main>

<script type="text/plain" id="sample">import pygame

pygame.init()
screen = pygame.display.set_mode((400, 300))
clock = pygame.time.Clock()
x, y = 200, 150

running = True
while running:
    for event in pygame.event.get():
        if event.type == pygame.QUIT:
            running = False
        if event.type == pygame.MOUSEBUTTONDOWN:
            x, y = event.pos

    screen.fill((30, 30, 60))
    pygame.draw.circle(screen, (255, 200, 0), (x, y), 30)
    pygame.display.flip()
    clock.tick(60)
</script>

<script type="text/plain" id="runner">
import ast, asyncio, inspect, os, traceback

os.environ["SDL_EMSCRIPTEN_KEYBOARD_ELEMENT"] = "#canvas"
_stop = False

class _Stop(BaseException):
    pass

async def __frame():
    # 画面を更新する時間をブラウザに渡す
    await asyncio.sleep(0)
    if _stop:
        raise _Stop

class _AddFrame(ast.NodeTransformer):
    def visit_FunctionDef(self, node):
        return node  # 普通の関数の中は変えない

    def visit_ClassDef(self, node):
        return node

    def visit_Lambda(self, node):
        return node

    def visit_While(self, node):
        self.generic_visit(node)
        wait = ast.parse("await __frame()").body[0]
        node.body.insert(0, ast.copy_location(wait, node))
        return node

    def visit_Expr(self, node):
        # asyncio.run(main()) は await main() に置きかえる
        v = node.value
        if (isinstance(v, ast.Call) and isinstance(v.func, ast.Attribute)
                and v.func.attr == "run" and isinstance(v.func.value, ast.Name)
                and v.func.value.id == "asyncio" and len(v.args) == 1):
            node.value = ast.copy_location(ast.Await(v.args[0]), v)
        return node

def _prepare(source):
    tree = _AddFrame().visit(ast.parse(source, "main.py"))
    ast.fix_missing_locations(tree)
    return compile(tree, "main.py", "exec", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)

async def run_user(source):
    global _stop
    _stop = False
    try:
        env = {"__name__": "__main__", "__frame": __frame}
        result = eval(_prepare(source), env)
        if inspect.isawaitable(result):
            await result
        print("--- 終了しました ---")
    except _Stop:
        print("--- 停止しました ---")
    except SystemExit:
        print("--- 終了しました ---")
    except BaseException:
        print(traceback.format_exc())
    finally:
        try:
            import pygame
            pygame.quit()
        except ImportError:
            pass

def stop_user():
    global _stop
    _stop = True
</script>

<script type="text/plain" id="completer">
import builtins, importlib, keyword, json, re

_MODULES = {"pygame", "math", "random", "time", "sys", "os", "asyncio", "json",
            "datetime", "collections", "itertools", "re", "string", "copy"}

def complete(source, base, prefix):
    found = {}
    if base:
        # 「pygame.draw.」のような、ドットの後ろの候補
        aliases = {}
        for m in re.finditer(r"^\s*import\s+([\w.]+)(?:\s+as\s+(\w+))?", source, re.M):
            name, alias = m.group(1), m.group(2)
            if alias:
                aliases[alias] = name
            else:
                top = name.split(".")[0]
                aliases[top] = top
        first, *rest = base.split(".")
        target = aliases.get(first)
        if target and target.split(".")[0] in _MODULES:
            try:
                obj = importlib.import_module(target)
                for part in rest:
                    obj = getattr(obj, part)
                for n in dir(obj):
                    if not n.startswith("_"):
                        value = getattr(obj, n, None)
                        found[n] = "関数" if callable(value) else "属性"
            except Exception:
                pass
    else:
        for n in keyword.kwlist:
            found[n] = "キーワード"
        for n in dir(builtins):
            if not n.startswith("_"):
                found[n] = "組み込み"
        for n in re.findall(r"\b[^\W\d]\w*", source):
            if n != prefix:
                found.setdefault(n, "このコード内")
    low = prefix.lower()
    names = [n for n in found if n.lower().startswith(low) and n != prefix]
    order = {"このコード内": 0, "組み込み": 1, "キーワード": 1}
    common = ["print", "range", "import", "if", "for", "while", "def"]
    names.sort(key=lambda n: (not n.startswith(prefix), order.get(found[n], 1),
                              common.index(n) if n in common else 99, len(n), n))
    return json.dumps([[n, found[n]] for n in names[:30]], ensure_ascii=False)
</script>

<script src="pyodide/pyodide.js"></script>
<script>
const $ = id => document.getElementById(id);
const code = $("code"), out = $("out"), status = $("status"), popup = $("popup");
const log = text => { out.textContent = (out.textContent + text + "\n").slice(-20000); out.scrollTop = out.scrollHeight; };

// アプリ側(Swift)とのやりとり
const native = window.webkit?.messageHandlers;
code.value = window.nativeCode ?? $("sample").textContent;
const autosave = () => native?.autosave.postMessage(code.value);

// ---- 色分け ----
const KEYWORDS = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
const BUILTINS = new Set("abs all any bool bytes chr dict dir divmod enumerate filter float format getattr hasattr hex input int isinstance iter len list map max min next object open ord pow print range repr reversed round set setattr slice sorted str sum super tuple type zip".split(" "));
const TOKEN = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:"""[\s\S]*?(?:"""|$)|\x27\x27\x27[\s\S]*?(?:\x27\x27\x27|$)|"(?:\\.|[^"\\\n])*"?|\x27(?:\\.|[^\x27\\\n])*\x27?))|(\b\d[\w.]*)|([\p{L}_][\p{L}\p{N}_]*)|([+\-*\/%=<>!&|^~]+)/gu;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function highlight(src) {
  let html = "", last = 0, prev = "";
  for (const m of src.matchAll(TOKEN)) {
    html += esc(src.slice(last, m.index));
    const [t, com, str, num, word] = m;
    let cls = com ? "c" : str ? "s" : num ? "n" : word ? "" : "o";
    if (word) {
      const call = /^\s*\(/.test(src.slice(m.index + t.length, m.index + t.length + 20));
      if (word === "True" || word === "False" || word === "None") cls = "n";
      else if (KEYWORDS.has(word)) cls = "k";
      else if (prev === "class") cls = "t";
      else if (prev === "def") cls = "f";
      else if (word === "self") cls = "v";
      else if (BUILTINS.has(word) && src[m.index - 1] !== ".") cls = "b";
      else if (call) cls = "f";
      prev = word;
    }
    html += cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t);
    last = m.index + t.length;
  }
  return html + esc(src.slice(last));
}
function syncScroll() {
  $("hl").style.transform = `translate(${-code.scrollLeft}px, ${-code.scrollTop}px)`;
  $("nums").style.transform = `translateY(${-code.scrollTop}px)`;
}
function render() {
  $("hl").innerHTML = highlight(code.value) + "\n ";
  $("nums").textContent = code.value.split("\n").map((_, i) => i + 1).join("\n");
  syncScroll();
}

// ---- 入力補完 ----
let pyComplete = null, items = [], selected = 0, wordLength = 0;
function hidePopup() { popup.hidden = true; items = []; }
function insert(text) {
  // execCommandを使うと「元に戻す」が効く
  if (!document.execCommand("insertText", false, text)) {
    code.setRangeText(text, code.selectionStart, code.selectionEnd, "end");
    code.dispatchEvent(new Event("input"));
  }
}
function inStringOrComment(before) {
  for (const m of before.matchAll(TOKEN)) {
    if ((m[1] || m[2]) && m.index + m[0].length === before.length) {
      if (m[1]) return true;
      const q = m[2].replace(/^[a-zA-Z]+/, "");
      const mark = q.startsWith(q[0].repeat(3)) ? q[0].repeat(3) : q[0];
      return !(q.length >= mark.length * 2 && q.endsWith(mark));
    }
  }
  return false;
}
function suggest() {
  const pos = code.selectionStart;
  if (!pyComplete || pos !== code.selectionEnd || document.activeElement !== code) return hidePopup();
  const before = code.value.slice(0, pos);
  const m = before.match(/(?:([\p{L}_][\p{L}\p{N}_]*(?:\.[\p{L}_][\p{L}\p{N}_]*)*)\.)?([\p{L}_][\p{L}\p{N}_]*)?$/u);
  const base = m[1] || "", prefix = m[2] || "";
  if ((!base && !prefix) || /\w/.test(code.value[pos] || "") || inStringOrComment(before)) return hidePopup();
  if (!base && before[before.length - prefix.length - 1] === ".") return hidePopup();
  items = JSON.parse(pyComplete(code.value, base, prefix));
  if (!items.length) return hidePopup();
  selected = 0;
  wordLength = prefix.length;
  popup.replaceChildren(...items.map(([name, kind], i) => {
    const row = document.createElement("div");
    const a = document.createElement("span"), b = document.createElement("small");
    a.textContent = name; b.textContent = kind;
    row.append(a, b);
    row.addEventListener("pointerdown", e => e.preventDefault());
    row.addEventListener("mousedown", e => e.preventDefault());
    row.onclick = () => accept(i);
    return row;
  }));
  popup.hidden = false;
  popup.scrollTop = 0;
  mark();
  place(before);
}
function place(before) {
  const lines = before.split("\n");
  $("measure").textContent = lines[lines.length - 1];
  const box = $("editor"), left = $("gutter").offsetWidth + 8 + $("measure").offsetWidth - code.scrollLeft;
  const top = 8 + lines.length * 24 - code.scrollTop;
  popup.style.left = Math.max(4, Math.min(left, box.clientWidth - popup.offsetWidth - 4)) + "px";
  // 下に入らないときは、カーソルの上に出す
  const above = top + popup.offsetHeight > box.clientHeight && top - 24 > popup.offsetHeight;
  popup.style.top = (above ? top - 24 - popup.offsetHeight : top) + "px";
}
function mark() {
  [...popup.children].forEach((el, i) => el.classList.toggle("on", i === selected));
  popup.children[selected]?.scrollIntoView({ block: "nearest" });
}
function accept(i) {
  const name = items[i][0];
  code.focus();
  code.setSelectionRange(code.selectionStart - wordLength, code.selectionStart);
  insert(name);
  hidePopup();
}

code.addEventListener("input", e => { render(); autosave(); if (e.inputType?.startsWith("delete") || e.inputType === "insertText") suggest(); else hidePopup(); });
code.addEventListener("compositionend", () => setTimeout(suggest));
code.addEventListener("scroll", () => { syncScroll(); hidePopup(); });
code.addEventListener("click", hidePopup);
code.addEventListener("blur", hidePopup);
code.addEventListener("keydown", e => {
  if (e.isComposing) return;
  if (!popup.hidden) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      selected = (selected + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      return mark();
    }
    if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); return accept(selected); }
    if (e.key === "Escape") { e.preventDefault(); return hidePopup(); }
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") hidePopup();
  }
  const pos = code.selectionStart, before = code.value.slice(0, pos);
  const line = before.slice(before.lastIndexOf("\n") + 1);
  if (e.key === "Tab") { e.preventDefault(); insert("    "); }
  else if (e.key === "Enter") {
    e.preventDefault();
    let indent = line.match(/^ */)[0];
    if (line.trimEnd().endsWith(":")) indent += "    ";
    insert("\n" + indent);
  } else if (e.key === "Backspace" && pos === code.selectionEnd && line.length && /^ +$/.test(line)) {
    // 行の先頭の空白は、4文字ずつ消す
    e.preventDefault();
    code.setSelectionRange(pos - ((line.length - 1) % 4 + 1), pos);
    if (!document.execCommand("delete")) { code.setRangeText(""); code.dispatchEvent(new Event("input")); }
  }
});

// ---- ボタン ----
const showPanel = show => { $("panel").hidden = !show; hidePopup(); };
$("toggle").onclick = () => showPanel($("panel").hidden);
$("open").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0];
  if (f && confirm("今のプログラムを、選んだファイルに置きかえますか？")) {
    code.value = await f.text();
    $("name").textContent = f.name;
    render(); autosave();
  }
  e.target.value = "";
};
$("save").onclick = () => native?.exportFile.postMessage(code.value);

async function start() {
  try {
    const py = await loadPyodide({ indexURL: new URL("pyodide/", location.href).href });
    py.setStdout({ batched: log });
    py.setStderr({ batched: log });
    py._api._skip_unwind_fatal_error = true;
    py.canvas.setCanvas2D($("canvas"));
    await py.loadPackage("pygame-ce");
    py.runPython($("runner").textContent);
    const runUser = py.globals.get("run_user");
    const stopUser = py.globals.get("stop_user");

    // 入力補完は、実行するコードとは別の場所に読み込む
    const space = py.globals.get("dict")();
    py.runPython($("completer").textContent, { globals: space });
    pyComplete = space.get("complete");

    let running = false;
    const setRunning = on => {
      running = on;
      $("run").classList.toggle("running", on);
      $("run").setAttribute("aria-label", on ? "停止" : "実行");
      status.textContent = on ? "実行中" : "準備OK";
    };
    $("run").onclick = async () => {
      if (running) return stopUser();
      setRunning(true);
      out.textContent = "";
      code.blur();
      showPanel(true);
      $("canvas").focus();
      try {
        await py.loadPackagesFromImports(code.value).catch(() => {});
        await runUser(code.value);
      } catch (e) {
        log(String(e));
      } finally {
        setRunning(false);
      }
    };
    $("canvas").addEventListener("pointerdown", () => $("canvas").focus());
    $("run").disabled = false;
    status.textContent = "準備OK";
  } catch (e) {
    status.textContent = "読み込みに失敗しました";
    showPanel(true);
    log(String(e));
  }
}
render();
start();
</script>
