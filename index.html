<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: -apple-system, sans-serif; -webkit-text-size-adjust: 100%; }
header { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-bottom: 1px solid var(--line); }
header .title { flex: 1; text-align: center; min-width: 0; }
#name { font-weight: 600; color: var(--fg); }
#status { font-size: 12px; color: var(--comment); }
header button { width: 44px; height: 44px; border: 0; background: none; color: var(--func); display: flex; align-items: center; justify-content: center; border-radius: 8px; padding: 0; }
header button:active { background: var(--line); }
header button:disabled { opacity: .35; }
svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#run svg { fill: currentColor; stroke: none; width: 26px; height: 26px; }
#run { color: var(--string); }
#run.running { color: var(--self); }
#run .stop, #run.running .play { display: none; }
#run.running .stop { display: block; }
main { flex: 1; display: flex; min-height: 0; }
#editor { flex: 1; display: flex; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
#code, #hl, #nums, #measure { font-family: Menlo, ui-monospace, monospace; font-size: var(--size); line-height: var(--lh); tab-size: 4; font-variant-ligatures: none; letter-spacing: 0; }
#gutter { width: calc(var(--size) * 3); overflow: hidden; flex: none; }
#nums { margin: 0; padding: 8px 10px 8px 0; text-align: right; color: color-mix(in srgb, var(--fg) 40%, var(--bg)); }
#area { flex: 1; position: relative; overflow: hidden; min-width: 0; }
#hl { position: absolute; top: 0; left: 0; margin: 0; padding: 8px; white-space: pre; pointer-events: none; min-width: 100%; }
#code { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 8px; border: 0; outline: 0; resize: none; background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--func); white-space: pre; overflow-wrap: normal; overflow: auto; }
#code::selection { background: rgba(103,118,150,.4); }
#measure { position: absolute; visibility: hidden; white-space: pre; top: 0; left: 0; }
.k { color: var(--keyword); } .s { color: var(--string); } .c { color: var(--comment); } .n { color: var(--number); }
.f { color: var(--func); } .b { color: var(--builtin); } .t { color: var(--type); } .v { color: var(--self); } .o { color: var(--builtin); }
#popup { position: absolute; z-index: 10; width: 300px; max-width: calc(100% - 8px); max-height: 192px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
#popup div { display: flex; justify-content: space-between; gap: 12px; padding: 0 10px; height: 38px; align-items: center; font: 15px Menlo, ui-monospace, monospace; cursor: pointer; }
#popup div.on { background: var(--line); color: var(--fg); }
#popup small { color: var(--comment); font-family: -apple-system, sans-serif; white-space: nowrap; }
#panel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; border-left: 1px solid var(--line); }
#panel[hidden], #popup[hidden] { display: none; }
#screen { flex: 2; overflow: hidden; display: flex; justify-content: center; align-items: center; padding: 8px; min-height: 0; }
#canvas { width: auto !important; height: auto !important; max-width: 100%; max-height: 100%; background: #000; touch-action: none; outline: 0; }
#out { flex: 1; overflow: auto; margin: 0; padding: 10px; border-top: 1px solid var(--line); white-space: pre-wrap; font: 14px/1.5 Menlo, ui-monospace, monospace; }
@media (orientation: portrait) { main { flex-direction: column; } #panel { border-left: 0; border-top: 1px solid var(--line); } }
/* 全画面表示 */
body.full #screen { position: fixed; inset: 0; z-index: 20; padding: 0; background: #000; }
#exit { position: fixed; z-index: 21; top: 8px; right: 8px; width: 48px; height: 48px; border: 0; border-radius: 24px; background: rgba(40,44,52,.75); color: #e06c75; font-size: 22px; display: none; }
body.full #exit { display: block; }
/* 設定画面 */
dialog { width: min(480px, 94vw); max-height: 90%; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); overflow: auto; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog .head { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
dialog h2 { font-size: 13px; color: var(--comment); margin: 16px 16px 4px; }
dialog label { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px; }
dialog select, dialog .btn { font-size: 16px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
dialog input[type=color] { width: 52px; height: 32px; border: 0; padding: 0; background: none; }
dialog input[type=checkbox] { width: 22px; height: 22px; }
#reset { margin: 8px 16px 16px; }
</style>

<script type="text/plain" id="runner">
import ast, asyncio, inspect, os, time, traceback

os.environ["SDL_EMSCRIPTEN_KEYBOARD_ELEMENT"] = "#canvas"
_stop = False
os.environ["PYGAME_HIDE_SUPPORT_PROMPT"] = "1"

class _Stop(BaseException):
    pass

_next = 0.0  # 次のコマを始めてよい時刻

class _Clock:
    # もとのClockは待つ間に画面を止めることがあるので、置きかえる
    def __init__(self):
        self._last = time.perf_counter()
        self._times = []
        self._ms = 0

    def tick(self, framerate=0):
        global _next
        now = time.perf_counter()
        self._ms = int((now - self._last) * 1000)
        self._last = now
        self._times = (self._times + [self._ms])[-10:]
        if framerate > 0:
            _next = now + 1 / framerate
        return self._ms

    tick_busy_loop = tick

    def get_time(self):
        return self._ms

    get_rawtime = get_time

    def get_fps(self):
        total = sum(self._times)
        return 1000 * len(self._times) / total if total else 0.0

def _install(pygame):
    if getattr(pygame, "_editor_ready", False):
        return
    original = pygame.display.set_mode

    def set_mode(size=(0, 0), flags=0, *args, **kwargs):
        import js
        w, h = (int(size[0]), int(size[1])) if size else (0, 0)
        full = bool(flags & pygame.FULLSCREEN)
        if w == 0 or h == 0:
            w, h = int(js.window.innerWidth), int(js.window.innerHeight)
            full = True
        message = js.prepareScreen(w, h, full)
        if message:
            raise pygame.error(message)
        flags &= ~(pygame.FULLSCREEN | pygame.SCALED)
        return original((w, h), flags, *args, **kwargs)

    pygame.display.set_mode = set_mode
    pygame.time.Clock = _Clock
    pygame._editor_ready = True

async def __frame():
    # 画面の更新とタッチの処理をする時間をブラウザに渡す
    await asyncio.sleep(max(_next - time.perf_counter(), 0.004))
    if _stop:
        raise _Stop

class _AddFrame(ast.NodeTransformer):
    def visit_FunctionDef(self, node):
        return node  # 普通の関数の中は変えない

    def visit_ClassDef(self, node):
        return node

    def visit_Lambda(self, node):
        return node

    def visit_While(self, node):
        self.generic_visit(node)
        wait = ast.parse("await __frame()").body[0]
        node.body.insert(0, ast.copy_location(wait, node))
        return node

    def visit_Expr(self, node):
        # asyncio.run(main()) は await main() に置きかえる
        v = node.value
        if (isinstance(v, ast.Call) and isinstance(v.func, ast.Attribute)
                and v.func.attr == "run" and isinstance(v.func.value, ast.Name)
                and v.func.value.id == "asyncio" and len(v.args) == 1):
            node.value = ast.copy_location(ast.Await(v.args[0]), v)
        return node

def _prepare(source):
    tree = _AddFrame().visit(ast.parse(source, "main.py"))
    ast.fix_missing_locations(tree)
    return compile(tree, "main.py", "exec", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)

async def run_user(source):
    global _stop, _next
    _stop = False
    _next = 0.0
    try:
        try:
            import pygame
            _install(pygame)
        except ImportError:
            pass
        env = {"__name__": "__main__", "__frame": __frame}
        result = eval(_prepare(source), env)
        if inspect.isawaitable(result):
            await result
        print("--- 終了しました ---")
    except _Stop:
        print("--- 停止しました ---")
    except SystemExit:
        print("--- 終了しました ---")
    except BaseException:
        print(traceback.format_exc())
    finally:
        try:
            import pygame
            pygame.quit()
        except ImportError:
            pass

def stop_user():
    global _stop
    _stop = True
</script>

<script type="text/plain" id="completer">
import builtins, importlib, keyword, json, re

_MODULES = {"pygame", "math", "random", "time", "sys", "os", "asyncio", "json",
            "datetime", "collections", "itertools", "re", "string", "copy"}

def complete(source, base, prefix):
    found = {}
    if base:
        # 「pygame.draw.」のような、ドットの後ろの候補
        aliases = {}
        for m in re.finditer(r"^\s*import\s+([\w.]+)(?:\s+as\s+(\w+))?", source, re.M):
            name, alias = m.group(1), m.group(2)
            if alias:
                aliases[alias] = name
            else:
                top = name.split(".")[0]
                aliases[top] = top
        first, *rest = base.split(".")
        target = aliases.get(first)
        if target and target.split(".")[0] in _MODULES:
            try:
                obj = importlib.import_module(target)
                for part in rest:
                    obj = getattr(obj, part)
                for n in dir(obj):
                    if not n.startswith("_"):
                        value = getattr(obj, n, None)
                        found[n] = "関数" if callable(value) else "属性"
            except Exception:
                pass
    else:
        for n in keyword.kwlist:
            found[n] = "キーワード"
        for n in dir(builtins):
            if not n.startswith("_"):
                found[n] = "組み込み"
        for n in re.findall(r"\b[^\W\d]\w*", source):
            if n != prefix:
                found.setdefault(n, "このコード内")
    low = prefix.lower()
    names = [n for n in found if n.lower().startswith(low) and n != prefix]
    order = {"このコード内": 0, "組み込み": 1, "キーワード": 1}
    common = ["print", "range", "import", "if", "for", "while", "def"]
    names.sort(key=lambda n: (not n.startswith(prefix), order.get(found[n], 1),
                              common.index(n) if n in common else 99, len(n), n))
    return json.dumps([[n, found[n]] for n in names[:30]], ensure_ascii=False)
</script>

<script src="pyodide/pyodide.js"></script>
<script>
const $ = id => document.getElementById(id);
const code = $("code"), out = $("out"), status = $("status"), popup = $("popup");
const log = text => { out.textContent = (out.textContent + text + "\n").slice(-20000); out.scrollTop = out.scrollHeight; };

// アプリ側(Swift)とのやりとり
const native = window.webkit?.messageHandlers;
code.value = window.nativeCode ?? $("sample").textContent;
const autosave = () => native?.autosave.postMessage(code.value);

// ---- 設定 ----
const COLOR_NAMES = { bg: "背景", fg: "ふつうの文字", keyword: "キーワード（if など）", string: "文字列", number: "数字", func: "関数・ボタン", builtin: "組み込み・記号", comment: "コメント" };
const THEMES = {
  "One Dark Pro Flat": { bg: "#282c34", fg: "#abb2bf", keyword: "#c678dd", string: "#98c379", number: "#d19a66", func: "#61afef", builtin: "#56b6c2", comment: "#7f848e", type: "#e5c07b", self: "#e06c75" },
  "ライト": { bg: "#fafafa", fg: "#383a42", keyword: "#a626a4", string: "#3d7f3c", number: "#986801", func: "#2f66d0", builtin: "#0b7285", comment: "#808189", type: "#a36f00", self: "#ca3e35" },
  "Monokai風": { bg: "#272822", fg: "#f8f8f2", keyword: "#f92672", string: "#e6db74", number: "#ae81ff", func: "#a6e22e", builtin: "#66d9ef", comment: "#8f8a73", type: "#66d9ef", self: "#fd971f" },
  "ブラック": { bg: "#000000", fg: "#d4d4d4", keyword: "#c586c0", string: "#ce9178", number: "#b5cea8", func: "#4fc1ff", builtin: "#4ec9b0", comment: "#6a9955", type: "#dcdcaa", self: "#f44747" }
};
const DEFAULTS = { theme: "One Dark Pro Flat", colors: {}, size: 16, pair: true, complete: true, min: 1, dot: true };
let config = { ...DEFAULTS };
try { config = { ...DEFAULTS, ...JSON.parse(window.nativeSettings || "{}") }; } catch (e) {}
if (!THEMES[config.theme]) config.theme = DEFAULTS.theme;
const lineHeight = () => Math.round(config.size * 1.5);
const palette = () => ({ ...THEMES[config.theme], ...config.colors });
function applySettings() {
  const colors = palette(), root = document.documentElement.style;
  for (const [k, v] of Object.entries(colors)) root.setProperty("--" + k, v);
  root.setProperty("--line", "color-mix(in srgb, var(--fg) 18%, var(--bg))");
  root.setProperty("--size", config.size + "px");
  root.setProperty("--lh", lineHeight() + "px");
  const n = parseInt(colors.bg.slice(1), 16);
  const dark = (n >> 16) * .299 + ((n >> 8) & 255) * .587 + (n & 255) * .114 < 140;
  root.colorScheme = dark ? "dark" : "light";
  // 上下の余白の色もアプリ側で合わせる
  native?.appearance?.postMessage(JSON.stringify({ bg: colors.bg, dark }));
}
function saveSettings() { applySettings(); native?.settings?.postMessage(JSON.stringify(config)); }
function fillForm() {
  $("theme").value = config.theme;
  for (const k in COLOR_NAMES) $("color-" + k).value = palette()[k];
  for (const k of ["size", "min"]) $(k).value = config[k];
  for (const k of ["pair", "complete", "dot"]) $(k).checked = config[k];
}
function setupForm() {
  for (const name in THEMES) $("theme").add(new Option(name));
  for (const s of [12, 14, 16, 18, 20, 22, 24]) $("size").add(new Option(s, s));
  for (const s of [1, 2, 3, 4, 5]) $("min").add(new Option(s + "文字目", s));
  for (const [k, text] of Object.entries(COLOR_NAMES)) {
    const label = document.createElement("label"), input = document.createElement("input");
    input.type = "color"; input.id = "color-" + k;
    input.oninput = () => { config.colors = { ...config.colors, [k]: input.value }; saveSettings(); };
    label.append(text, input);
    $("colors").append(label);
  }
  $("theme").onchange = () => { config.theme = $("theme").value; config.colors = {}; saveSettings(); fillForm(); };
  $("reset").onclick = () => { config.colors = {}; saveSettings(); fillForm(); };
  for (const k of ["size", "min"]) $(k).onchange = () => { config[k] = Number($(k).value); saveSettings(); render(); };
  for (const k of ["pair", "complete", "dot"]) $(k).onchange = () => { config[k] = $(k).checked; saveSettings(); };
  $("gear").onclick = () => { hidePopup(); code.blur(); fillForm(); $("settings").showModal(); };
  $("close").onclick = () => $("settings").close();
}

// ---- 色分け ----
const KEYWORDS = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
const BUILTINS = new Set("abs all any bool bytes chr dict dir divmod enumerate filter float format getattr hasattr hex input int isinstance iter len list map max min next object open ord pow print range repr reversed round set setattr slice sorted str sum super tuple type zip".split(" "));
const TOKEN = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:"""[\s\S]*?(?:"""|$)|\x27\x27\x27[\s\S]*?(?:\x27\x27\x27|$)|"(?:\\.|[^"\\\n])*"?|\x27(?:\\.|[^\x27\\\n])*\x27?))|(\b\d[\w.]*)|([\p{L}_][\p{L}\p{N}_]*)|([+\-*\/%=<>!&|^~]+)/gu;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function highlight(src) {
  let html = "", last = 0, prev = "";
  for (const m of src.matchAll(TOKEN)) {
    html += esc(src.slice(last, m.index));
    const [t, com, str, num, word] = m;
    let cls = com ? "c" : str ? "s" : num ? "n" : word ? "" : "o";
    if (word) {
      const call = /^\s*\(/.test(src.slice(m.index + t.length, m.index + t.length + 20));
      if (word === "True" || word === "False" || word === "None") cls = "n";
      else if (KEYWORDS.has(word)) cls = "k";
      else if (prev === "class") cls = "t";
      else if (prev === "def") cls = "f";
      else if (word === "self") cls = "v";
      else if (BUILTINS.has(word) && src[m.index - 1] !== ".") cls = "b";
      else if (call) cls = "f";
      prev = word;
    }
    html += cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t);
    last = m.index + t.length;
  }
  return html + esc(src.slice(last));
}
function syncScroll() {
  $("hl").style.transform = `translate(${-code.scrollLeft}px, ${-code.scrollTop}px)`;
  $("nums").style.transform = `translateY(${-code.scrollTop}px)`;
}
function render() {
  $("hl").innerHTML = highlight(code.value) + "\n ";
  $("nums").textContent = code.value.split("\n").map((_, i) => i + 1).join("\n");
  syncScroll();
}

// ---- 入力補完 ----
let pyComplete = null, items = [], selected = 0, wordLength = 0;
function hidePopup() { popup.hidden = true; items = []; }
function insert(text) {
  // execCommandを使うと「元に戻す」が効く
  if (!document.execCommand("insertText", false, text)) {
    code.setRangeText(text, code.selectionStart, code.selectionEnd, "end");
    code.dispatchEvent(new Event("input"));
  }
}
function inStringOrComment(before) {
  for (const m of before.matchAll(TOKEN)) {
    if ((m[1] || m[2]) && m.index + m[0].length === before.length) {
      if (m[1]) return true;
      const q = m[2].replace(/^[a-zA-Z]+/, "");
      const mark = q.startsWith(q[0].repeat(3)) ? q[0].repeat(3) : q[0];
      return !(q.length >= mark.length * 2 && q.endsWith(mark));
    }
  }
  return false;
}
function suggest() {
  const pos = code.selectionStart;
  if (!pyComplete || pos !== code.selectionEnd || document.activeElement !== code) return hidePopup();
  const before = code.value.slice(0, pos);
  const m = before.match(/(?:([\p{L}_][\p{L}\p{N}_]*(?:\.[\p{L}_][\p{L}\p{N}_]*)*)\.)?([\p{L}_][\p{L}\p{N}_]*)?$/u);
  const base = m[1] || "", prefix = m[2] || "";
  const enough = base && !prefix ? config.dot : prefix.length >= config.min;
  if (!config.complete || !enough || (!base && !prefix) || /\w/.test(code.value[pos] || "") || inStringOrComment(before)) return hidePopup();
  if (!base && before[before.length - prefix.length - 1] === ".") return hidePopup();
  items = JSON.parse(pyComplete(code.value, base, prefix));
  if (!items.length) return hidePopup();
  selected = 0;
  wordLength = prefix.length;
  popup.replaceChildren(...items.map(([name, kind], i) => {
    const row = document.createElement("div");
    const a = document.createElement("span"), b = document.createElement("small");
    a.textContent = name; b.textContent = kind;
    row.append(a, b);
    row.addEventListener("pointerdown", e => e.preventDefault());
    row.addEventListener("mousedown", e => e.preventDefault());
    row.onclick = () => accept(i);
    return row;
  }));
  popup.hidden = false;
  popup.scrollTop = 0;
  mark();
  place(before);
}
function place(before) {
  const lines = before.split("\n");
  $("measure").textContent = lines[lines.length - 1];
  const box = $("editor"), left = $("gutter").offsetWidth + 8 + $("measure").offsetWidth - code.scrollLeft;
  const lh = lineHeight(), top = 8 + lines.length * lh - code.scrollTop;
  popup.style.left = Math.max(4, Math.min(left, box.clientWidth - popup.offsetWidth - 4)) + "px";
  // 下に入らないときは、カーソルの上に出す
  const above = top + popup.offsetHeight > box.clientHeight && top - lh > popup.offsetHeight;
  popup.style.top = (above ? top - lh - popup.offsetHeight : top) + "px";
}
function mark() {
  [...popup.children].forEach((el, i) => el.classList.toggle("on", i === selected));
  popup.children[selected]?.scrollIntoView({ block: "nearest" });
}
function accept(i) {
  const name = items[i][0];
  code.focus();
  code.setSelectionRange(code.selectionStart - wordLength, code.selectionStart);
  insert(name);
  hidePopup();
}

code.addEventListener("input", e => { render(); autosave(); if (e.inputType?.startsWith("delete") || e.inputType === "insertText") suggest(); else hidePopup(); });
code.addEventListener("compositionend", () => setTimeout(suggest));
code.addEventListener("scroll", () => { syncScroll(); hidePopup(); });
code.addEventListener("click", hidePopup);
code.addEventListener("blur", hidePopup);
// ---- かっこ・引用符の自動入力 ----
const PAIRS = { "(": ")", "[": "]", "{": "}", '"': '"', "'": "'" };
// iPadのキーボードが出す曲がった引用符は、まっすぐなものに直す
const STRAIGHT = { "\u2018": "'", "\u2019": "'", "\u201c": '"', "\u201d": '"' };
// カーソルが文字列の中なら引用符を、コメントの中なら "#" を返す
function context(before) {
  if (!inStringOrComment(before)) return "";
  const last = [...before.matchAll(TOKEN)].pop();
  return last[1] ? "#" : last[2].replace(/^[a-zA-Z]+/, "")[0];
}
function move(pos) { code.setSelectionRange(pos, pos); }
function insertAround(text, back) {
  insert(text);
  move(code.selectionStart - back);
  suggest();
}
let editing = false;
code.addEventListener("beforeinput", e => {
  if (editing || e.isComposing || e.inputType !== "insertText" || !e.data || e.data.length !== 1) return;
  const ch = STRAIGHT[e.data] || e.data, changed = ch !== e.data;
  const start = code.selectionStart, end = code.selectionEnd;
  const before = code.value.slice(0, start), next = code.value[end] || "";
  const quote = ch === '"' || ch === "'", where = context(before);
  const run = fn => { e.preventDefault(); editing = true; try { fn(); } finally { editing = false; } };
  // すでにある閉じる文字は、飛びこえるだけ
  if (config.pair && start === end && next === ch && (")]}".includes(ch) || (quote && where !== "#")))
    return run(() => { move(start + 1); hidePopup(); });
  if (where) {
    if (changed && where === ch) run(() => insert(ch));
    return;
  }
  if (config.pair && PAIRS[ch]) {
    if (start !== end) {  // 選んだ文字を囲む
      const text = code.value.slice(start, end);
      return run(() => { insert(ch + text + PAIRS[ch]); code.setSelectionRange(start + 1, end + 1); hidePopup(); });
    }
    const free = !next || /[\s)\]},:.]/.test(next);
    if (quote) {
      if (before.endsWith(ch + ch) && free) return run(() => insertAround(ch.repeat(4), 3));
      const word = before.match(/[\p{L}\p{N}_]*$/u)[0];
      if (free && (!word || /^(?:[rubf]|rb|br|rf|fr)$/i.test(word))) return run(() => insertAround(ch + ch, 1));
    } else if (free) return run(() => insertAround(ch + PAIRS[ch], 1));
  }
  if (changed) run(() => insert(ch));
});

code.addEventListener("keydown", e => {
  if (e.isComposing) return;
  if (!popup.hidden) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      selected = (selected + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      return mark();
    }
    if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); return accept(selected); }
    if (e.key === "Escape") { e.preventDefault(); return hidePopup(); }
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") hidePopup();
  }
  const pos = code.selectionStart, before = code.value.slice(0, pos);
  const line = before.slice(before.lastIndexOf("\n") + 1);
  if (e.key === "Tab") { e.preventDefault(); insert("    "); }
  else if (e.key === "Enter") {
    e.preventDefault();
    let indent = line.match(/^ */)[0];
    const open = before.slice(-1), close = code.value[code.selectionEnd];
    if (config.pair && "([{".includes(open) && open && PAIRS[open] === close) {
      insertAround("\n" + indent + "    \n" + indent, indent.length + 1);
    } else {
      if (line.trimEnd().endsWith(":")) indent += "    ";
      insert("\n" + indent);
    }
  } else if (e.key === "Backspace" && config.pair && pos === code.selectionEnd && PAIRS[code.value[pos - 1]] && PAIRS[code.value[pos - 1]] === code.value[pos]) {
    // 中が空のかっこは、まとめて消す
    e.preventDefault();
    code.setSelectionRange(pos - 1, pos + 1);
    if (!document.execCommand("delete")) { code.setRangeText(""); code.dispatchEvent(new Event("input")); }
  } else if (e.key === "Backspace" && pos === code.selectionEnd && line.length && /^ +$/.test(line)) {
    // 行の先頭の空白は、4文字ずつ消す
    e.preventDefault();
    code.setSelectionRange(pos - ((line.length - 1) % 4 + 1), pos);
    if (!document.execCommand("delete")) { code.setRangeText(""); code.dispatchEvent(new Event("input")); }
  }
});

// ---- ゲーム画面の大きさ ----
// Pythonの set_mode から呼ばれる。問題があれば説明の文を返す
window.prepareScreen = (w, h, forceFull) => {
  const ratio = window.devicePixelRatio || 1;
  const long = Math.round(Math.max(screen.width, screen.height) * ratio);
  const short = Math.round(Math.min(screen.width, screen.height) * ratio);
  const wide = window.innerWidth >= window.innerHeight;
  const maxW = wide ? long : short, maxH = wide ? short : long;
  if (w > maxW || h > maxH)
    return `画面サイズ ${w}×${h} は大きすぎます。今の向きでは ${maxW}×${maxH} までにしてください。`;
  document.body.classList.remove("full");
  $("panel").hidden = false;
  const area = $("screen");
  const full = forceFull || w > area.clientWidth - 16 || h > area.clientHeight - 16;
  document.body.classList.toggle("full", full);
  return "";
};

// ---- ボタン ----
const showPanel = show => { $("panel").hidden = !show; hidePopup(); };
$("toggle").onclick = () => showPanel($("panel").hidden);
$("open").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0];
  if (f && confirm("今のプログラムを、選んだファイルに置きかえますか？")) {
    code.value = await f.text();
    $("name").textContent = f.name;
    render(); autosave();
  }
  e.target.value = "";
};
$("save").onclick = () => native?.exportFile.postMessage(code.value);

async function start() {
  try {
    const py = await loadPyodide({ indexURL: new URL("pyodide/", location.href).href });
    py.setStdout({ batched: log });
    py.setStderr({ batched: log });
    py._api._skip_unwind_fatal_error = true;
    py.canvas.setCanvas2D($("canvas"));
    await py.loadPackage("pygame-ce");
    py.runPython($("runner").textContent);
    const runUser = py.globals.get("run_user");
    const stopUser = py.globals.get("stop_user");

    // 入力補完は、実行するコードとは別の場所に読み込む
    const space = py.globals.get("dict")();
    py.runPython($("completer").textContent, { globals: space });
    pyComplete = space.get("complete");

    let running = false;
    const setRunning = on => {
      running = on;
      $("run").classList.toggle("running", on);
      $("run").setAttribute("aria-label", on ? "停止" : "実行");
      status.textContent = on ? "実行中" : "準備OK";
      if (!on) document.body.classList.remove("full");
    };
    $("run").onclick = async () => {
      if (running) return stopUser();
      setRunning(true);
      out.textContent = "";
      code.blur();
      showPanel(true);
      $("canvas").focus();
      try {
        await py.loadPackagesFromImports(code.value, { messageCallback: () => {} }).catch(() => {});
        await runUser(code.value);
      } catch (e) {
        log(String(e));
      } finally {
        setRunning(false);
      }
    };
    $("exit").onclick = () => stopUser();
    $("canvas").addEventListener("pointerdown", () => $("canvas").focus());
    $("run").disabled = false;
    status.textContent = "準備OK";
  } catch (e) {
    status.textContent = "読み込みに失敗しました";
    showPanel(true);
    log(String(e));
  }
}
setupForm();
applySettings();
render();
start();
</script>
</body>
